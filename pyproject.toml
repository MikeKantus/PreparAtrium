[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preparatrium"
version = "0.1.0"
description = "Starter app for the PreparAtrium project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PreparAtrium" }]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
